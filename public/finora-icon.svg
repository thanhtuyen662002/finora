  <!-- Main Upward Ribbon Body -->
  <path d="M 18 80 C 12 55, 25 25, 50 15 C 32 30, 28 58, 38 82 C 32 88, 22 88, 18 80 Z" fill="url(#finora-ribbon-1-ic)" />
