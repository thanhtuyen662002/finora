  <!-- Top Sweeping Ribbon Blade -->
  <path d="M 25 15 C 45 5, 80 10, 95 30 C 105 45, 90 55, 65 52 C 45 50, 30 40, 25 15 Z" fill="url(#finora-ribbon-1-ic)" />
