<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Finora — Mất kết nối</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --button: #0f172a;
        --button-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --card: #0f172a;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --border: #1e293b;
          --button: #f1f5f9;
          --button-text: #0f172a;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      img { width: 64px; height: 64px; }
      h1 { margin: 16px 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }
      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: var(--button);
        color: var(--button-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Finora" />
      <h1>Bạn đang offline</h1>
      <p>
        Finora cần kết nối mạng để hiển thị số liệu tài chính mới nhất. Dữ liệu của bạn
        không được lưu trên thiết bị này. Hãy kiểm tra kết nối rồi thử lại.
      </p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
    <script>
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
